# XcodeGen spec for Spraak — an unofficial iOS app built on the Praat engine.
# GPL-3.0-or-later. Generates Spraak.xcodeproj so Xcode (or
# `xcodebuild -allowProvisioningUpdates`) can build + code-sign the app for a real
# iPhone — the shell build-app.sh targets the Simulator and does not sign. The engine
# static libs are linked per-SDK from ios/build-libs/<sdk>/ (see ENGINE_LIBS_DIR below),
# so device and simulator builds keep their own arm64 slices and never clobber each other.
#
# Build it:
#   brew install xcodegen
#   ios/build-engine-libs.sh both        # build + stage engine libs for device & simulator
#   export DEVELOPMENT_TEAM=XXXXXXXXXX   # your 10-char Apple Developer Team ID
#   xcodegen generate                    # -> Spraak.xcodeproj (git-ignored, regenerable)
# then open Spraak.xcodeproj, select your iPhone, and Run (Xcode registers the
# device + provisions the first time). If DEVELOPMENT_TEAM is unset, pick the team
# in Xcode ▸ target ▸ Signing & Capabilities instead.
name: Spraak
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  bundleIdPrefix: com.thermetery
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "5.0"
targets:
  Spraak:
    type: application
    platform: iOS
    sources:
      - path: ios/app/PraatApp.swift
      - path: ios/app/ContentView.swift
      - path: ios/app/PraatModel.swift
      - path: ios/app/AudioEngine.swift
      - path: ios/app/SpectrogramView.swift
      - path: ios/app/SettingsView.swift
      - path: ios/app/ObjectsView.swift
      - path: ios/app/CommandForms.swift
      - path: ios/app/TextGridEditor.swift
      - path: ios/app/VowelView.swift
      - path: ios/app/ManipulationView.swift
      - path: ios/app/ExperimentMFCView.swift
      - path: ios/app/PraatBridge.mm
      - path: ios/app/PraatBridge.h
      - path: ios/pa_ios_hostapis.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermetery.spraak
        PRODUCT_NAME: Spraak
        INFOPLIST_FILE: ios/app/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: ios/app/Spraak-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        # PraatBridge.h is a clean C interface (no Praat headers), so the Swift
        # Clang importer needs no Praat paths here — only the bridging header dir.
        # The Praat dirs go to the C/C++ compiles via -iquote below, NOT here:
        # HEADER_SEARCH_PATHS feeds the Swift importer too, and a target-wide -I
        # makes a system header's `#include <complex.h>` resolve to Praat's
        # melder/complex.h, which breaks every SDK module. Praat uses quoted
        # includes, so -iquote (searched only for "...") is the correct scope.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ios/app
        # C++/ObjC++ only (PraatBridge.mm): Praat defines + quoted-include dirs.
        OTHER_CPLUSPLUSFLAGS:
          - -Dmacintosh
          - -DPRAAT_IOS
          - -DNO_GRAPHICS
          - -DPRAAT_IOS_GRAPHICS
          - -iquote$(SRCROOT)/sys
          - -iquote$(SRCROOT)/melder
          - -iquote$(SRCROOT)/kar
          - -iquote$(SRCROOT)/fon
          - -iquote$(SRCROOT)/dwsys
          - -iquote$(SRCROOT)/stat
          - -iquote$(SRCROOT)/LPC
          - -iquote$(SRCROOT)/gram
          - -iquote$(SRCROOT)/dwtools
          - -iquote$(SRCROOT)/external/gsl
        # C only (pa_ios_hostapis.c includes "pa_hostapi.h").
        OTHER_CFLAGS:
          - -iquote$(SRCROOT)/external/portaudio
        # Per-SDK engine-lib dir: device & simulator arm64 slices can't share one .a
        # (same arch — lipo refuses; it's why .xcframeworks exist), so each platform
        # links its own staged set, built/staged by ios/build-engine-libs.sh. Xcode
        # substitutes the path matching the active SDK.
        ENGINE_LIBS_DIR: $(SRCROOT)/ios/build-libs/iphonesimulator
        "ENGINE_LIBS_DIR[sdk=iphoneos*]": $(SRCROOT)/ios/build-libs/iphoneos
        "ENGINE_LIBS_DIR[sdk=iphonesimulator*]": $(SRCROOT)/ios/build-libs/iphonesimulator
        # Static engine libs, in the upstream link order (fon appears twice on purpose).
        OTHER_LDFLAGS:
          - $(ENGINE_LIBS_DIR)/fon/libfon.a
          - $(ENGINE_LIBS_DIR)/artsynth/libartsynth.a
          - $(ENGINE_LIBS_DIR)/FFNet/libFFNet.a
          - $(ENGINE_LIBS_DIR)/gram/libgram.a
          - $(ENGINE_LIBS_DIR)/EEG/libEEG.a
          - $(ENGINE_LIBS_DIR)/LPC/libLPC.a
          - $(ENGINE_LIBS_DIR)/dwtools/libdwtools.a
          - $(ENGINE_LIBS_DIR)/sensors/libsensors.a
          - $(ENGINE_LIBS_DIR)/foned/libfoned.a
          - $(ENGINE_LIBS_DIR)/fon/libfon.a
          - $(ENGINE_LIBS_DIR)/stat/libstat.a
          - $(ENGINE_LIBS_DIR)/dwsys/libdwsys.a
          - $(ENGINE_LIBS_DIR)/sys/libsys.a
          - $(ENGINE_LIBS_DIR)/melder/libmelder.a
          - $(ENGINE_LIBS_DIR)/kar/libkar.a
          - $(ENGINE_LIBS_DIR)/external/espeak/libespeak.a
          - $(ENGINE_LIBS_DIR)/external/portaudio/libportaudio.a
          - $(ENGINE_LIBS_DIR)/external/flac/libflac.a
          - $(ENGINE_LIBS_DIR)/external/lame/liblame.a
          - $(ENGINE_LIBS_DIR)/external/mp3/libmp3.a
          - $(ENGINE_LIBS_DIR)/external/glpk/libglpk.a
          - $(ENGINE_LIBS_DIR)/external/clapack/libclapack.a
          - $(ENGINE_LIBS_DIR)/external/gsl/libgsl.a
          - $(ENGINE_LIBS_DIR)/external/num/libnum.a
          - $(ENGINE_LIBS_DIR)/external/vorbis/libvorbis.a
          - $(ENGINE_LIBS_DIR)/external/opusfile/libopusfile.a
          - $(ENGINE_LIBS_DIR)/external/whispercpp/libwhisper.a
          - -lc++
          - -lm
    dependencies:
      - sdk: CoreFoundation.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: ImageIO.framework
      - sdk: AVFoundation.framework
      - sdk: MobileCoreServices.framework
schemes:
  Spraak:
    build:
      targets:
        Spraak: all
    run:
      config: Debug
